<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <rect width="44" height="44" fill="#141040"/>
    <!-- Gold/Indigo DIP-IC Pins -->
    <g fill="#b9afff">
        <rect x="1" y="8" width="4" height="3" />
        <rect x="1" y="16" width="4" height="3" />
        <rect x="1" y="25" width="4" height="3" />
        <rect x="1" y="33" width="4" height="3" />
        <rect x="39" y="8" width="4" height="3" />
        <rect x="39" y="16" width="4" height="3" />
        <rect x="39" y="25" width="4" height="3" />
        <rect x="39" y="33" width="4" height="3" />
    </g>
    <!-- IC Package -->
    <rect x="5" y="4" width="34" height="36" fill="#07060d" stroke="#4a3d99" stroke-width="2" />
    <rect x="7" y="6" width="30" height="32" fill="#1c1544" stroke="#88d8ff" stroke-width="1" />
    <!-- Chip Notch -->
    <rect x="18" y="4" width="8" height="3" fill="#ffcc33" />
    <!-- Demoscene Raster Bars -->
    <rect x="9" y="10" width="26" height="2" fill="#ff4455" />
    <rect x="9" y="14" width="26" height="2" fill="#ffcc33" />
    <rect x="9" y="18" width="26" height="2" fill="#5c94fc" />
    <!-- 4-Channel Pulse Wave -->
    <rect x="10" y="24" width="5" height="11" fill="#76d6ff" />
    <rect x="17" y="17" width="4" height="18" fill="#ffffff" />
    <rect x="23" y="13" width="4" height="22" fill="#ff4455" />
    <rect x="29" y="21" width="5" height="14" fill="#76d6ff" />
    <!-- Specular Highlight -->
    <rect x="9" y="8" width="5" height="2" fill="#ffffff" />
</svg>